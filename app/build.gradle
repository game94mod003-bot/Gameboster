plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('ABOLIX_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ABOLIX_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('ABOLIX_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ABOLIX_KEY_PASSWORD')
def canSignRelease = releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseKeystore).exists()
def ciVersionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def appVersionName = System.getenv('ABOLIX_VERSION_NAME') ?: '1.0.2'

android {
    namespace 'com.abolix.gamebooster'
    compileSdk 34

    // AGP 8.x disables BuildConfig generation by default. AbolixVpnService
    // uses BuildConfig.DEBUG, VERSION_CODE and VERSION_NAME during libbox setup.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.abolix.gamebooster'
        minSdk 24
        targetSdk 34
        versionCode ciVersionCode
        versionName appVersionName
    }

    // sing-box ships native libraries for several CPU architectures. Build only
    // phone ABIs so each APK contains one libbox binary instead of a universal set.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.github.singbox-android:libbox:1.14.4'
    implementation 'org.yaml:snakeyaml:2.7'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
}
