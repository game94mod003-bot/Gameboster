plugins {
    id 'com.android.application'
}

def ver = System.getenv('APP_VERSION') ?: '1.0.0'
def verCode = (System.getenv('APP_VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'com.abolix.vpn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.abolix.vpn'
        minSdk 26
        targetSdk 34
        versionCode verCode
        versionName ver
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }

    // xray runs as a child process from nativeLibraryDir, so .so files must be extracted to disk
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    compileOptions {
        encoding 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
