name: Build Abolix VPN

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release from this run'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      # ---- Xray-core (proxy engine; runs as a child process from nativeLibraryDir)
      - name: Fetch Xray-core
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          base=https://github.com/XTLS/Xray-core/releases/latest/download
          curl -fsSL -o x64.zip  $base/Xray-android-arm64-v8a.zip
          curl -fsSL -o x32.zip  $base/Xray-linux-arm32-v7a.zip
          unzip -p x64.zip xray > app/src/main/jniLibs/arm64-v8a/libxray.so
          unzip -p x32.zip xray > app/src/main/jniLibs/armeabi-v7a/libxray.so
          chmod +x app/src/main/jniLibs/*/libxray.so
          ls -l app/src/main/jniLibs/*/

      # ---- hev-socks5-tunnel (tun -> SOCKS bridge, gives real system-wide VPN)
      # If this step fails the app still builds and falls back to "proxy mode" (setHttpProxy).
      - name: Build hev-socks5-tunnel (NDK)
        continue-on-error: true
        run: |
          set -e
          mkdir -p tun/jni && cd tun
          echo 'include $(call all-subdir-makefiles)' > jni/Android.mk
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel.git jni/hev-socks5-tunnel
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk \
            APP_ABI="arm64-v8a armeabi-v7a" APP_PLATFORM=android-26 NDK_LIBS_OUT=./libs NDK_OUT=./obj -j4
          for abi in arm64-v8a armeabi-v7a; do
            cp libs/$abi/libhev-socks5-tunnel.so ../app/src/main/jniLibs/$abi/
          done
          ls -l ../app/src/main/jniLibs/*/

      # ---- signing: use your permanent keystore if the secrets exist, otherwise a throw-away one
      - name: Prepare signing key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/abolix.jks
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "::warning::No KEYSTORE_BASE64 secret: using a temporary key. Updates over a previous install will fail - add the secrets (see README)."
            keytool -genkeypair -v -keystore $RUNNER_TEMP/abolix.jks -storepass abolix123 -keypass abolix123 \
              -alias abolix -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Abolix, O=Abolix, C=IR"
            echo "KEYSTORE_PASSWORD=abolix123" >> $GITHUB_ENV
            echo "KEY_ALIAS=abolix" >> $GITHUB_ENV
            echo "KEY_PASSWORD=abolix123" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/abolix.jks" >> $GITHUB_ENV

      - name: Build signed release APKs
        run: gradle assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do cp "$f" "dist/AbolixVPN-v${APP_VERSION}.apk"; done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: AbolixVPN-apk
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Abolix VPN v${{ env.APP_VERSION }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ابولیکس — اپ اندروید عبور با Domain Fronting
            کانال تلگرام: @Abolix
            نصب: فایل APK را دانلود و نصب کنید، سپس لینک کانفیگ را در تب «کانفیگ» اضافه کنید.
