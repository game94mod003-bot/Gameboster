name: Abolix Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build signed release or debug fallback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # This project intentionally follows the uploaded sample and has no Gradle Wrapper.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Set release version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "ABOLIX_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Prepare release signing key when secrets exist
        id: signing
        shell: bash
        env:
          ABOLIX_KEYSTORE_BASE64: ${{ secrets.ABOLIX_KEYSTORE_BASE64 }}
          ABOLIX_STORE_PASSWORD: ${{ secrets.ABOLIX_STORE_PASSWORD }}
          ABOLIX_KEY_ALIAS: ${{ secrets.ABOLIX_KEY_ALIAS }}
          ABOLIX_KEY_PASSWORD: ${{ secrets.ABOLIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${ABOLIX_KEYSTORE_BASE64}" && -n "${ABOLIX_STORE_PASSWORD}" && -n "${ABOLIX_KEY_ALIAS}" && -n "${ABOLIX_KEY_PASSWORD}" ]]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/abolix-release.jks"
            printf '%s' "$ABOLIX_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "ABOLIX_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ABOLIX_STORE_PASSWORD=$ABOLIX_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ABOLIX_KEY_ALIAS=$ABOLIX_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ABOLIX_KEY_PASSWORD=$ABOLIX_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found; building debug APK fallback." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble signed release APK
        if: steps.signing.outputs.variant == 'release'
        run: gradle --no-daemon :app:assembleRelease

      - name: Assemble debug APK fallback
        if: steps.signing.outputs.variant == 'debug'
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: abolix-${{ steps.signing.outputs.variant }}-apk
          path: app/build/outputs/apk/${{ steps.signing.outputs.variant }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for signed tags
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.variant == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH=(app/build/outputs/apk/release/*.apk)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${APK_PATH[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${APK_PATH[@]}" \
              --title "Abolix ${GITHUB_REF_NAME}" \
              --notes "Signed Android APK for Abolix. Built by GitHub Actions."
          fi
